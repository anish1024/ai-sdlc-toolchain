    interface:
      protocol: python-module
    tests: []
    notes: "Settlement-persistence gap RESOLVED (proposed design, not confirmed by anyone) — see generate_settlement_round's notes for the full reasoning. Short version: introduced a SettlementRound concept (a batch of SettlementRecords generated together from one balance_aggregator + settlement_engine call), and expenses become permanently locked once included in ANY round, rather than tracking a fuzzy per-expense \"settled\" status. This also resolves what edit_expense/delete_expense's \"settled\" check actually means — see their updated notes below.\n\n\nSplit into 4 leaves below. Real gateway (Stripe Connect) is PRD §9 Phase 3 — out of scope."
  - id: generate_settlement_round
    title: Compute and persist a settlement round for a group
    status: contract_defined
    parent: payment_service
    dependencies:
      - node: balance_aggregator
      - node: settlement_engine
      - node: list_group_expenses
      - node: save_record
    interface:
      protocol: python-function
      signature: 'generate_settlement_round(group_id: str) -> SettlementRound'
      types:
        SettlementRound: '{ id: str, group_id: str, generated_at: str, covered_expense_ids: list[str], status: ''pending'' | ''completed'', records: list[SettlementRecord] }'
        SettlementRecord: '{ id: str, round_id: str, from_user: str, to_user: str, amount: Decimal, status: ''pending'' | ''paid'' }'
    stub_behavior: 'Calls balance_aggregator.compute_net_balances(group_id), then settlement_engine.compute_settlements(balances); persists the result as a SettlementRound with one SettlementRecord per instruction; covered_expense_ids = every expense currently in the group (from list_group_expenses) at generation time. Those expenses become permanently locked (see is_expense_locked).

      '
    tests:
      - id: gen-round-01
        type: contract
        description: same 4-user numbers as settlement_engine's settle-02 and balance_aggregator's bal-01, chained through end to end
        given:
          group_id: g1
        expect:
          records:
            - from_user: B
              to_user: A
              amount: 25
            - from_user: C
              to_user: A
              amount: 25
            - from_user: D
              to_user: A
              amount: 25
          status: pending
      - id: gen-round-02
        type: contract
        description: 'PROPOSED: a group with all-zero balances (nothing owed) generates an empty round, not an error'
        given:
          group_id: g_all_settled
        expect:
          records: []
          status: completed
      - id: gen-round-03
        type: contract
        description: "PROPOSED: cannot generate a new round while a prior round for the same group is still pending — avoids overlapping/conflicting rounds"
        given:
          group_id: g1
          existing_pending_round: true
        expect_raises: SettlementRoundAlreadyPending
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - balance_aggregator.interface
        - settlement_engine.interface
    notes: "This is the node that closes the persistence gap. Reasoning: the PRD's settlement_engine is a pure function with no ids to reference (payment_service's original gap). Rather than bolt an id onto individual instructions ad hoc, introduced a SettlementRound as the actual persisted unit — one round = one \"settle up now\" action, covering whatever expenses exist at that moment. gen-round-03's constraint (no overlapping rounds) is a real design choice, not incidental: without it, two rounds could double-count the same expenses into conflicting balances. All three defaults here are PROPOSED — override freely, but they're internally consistent with each other, not independent guesses.\n"
  - id: mark_settlement_paid
    title: Mark one settlement record as paid
    status: contract_defined
    parent: payment_service
    interface:
      protocol: python-function
      signature: 'mark_settlement_paid(settlement_record_id: str) -> SettlementRecord'
    stub_behavior: 'Sets the record''s status to ''paid''. If this was the last pending record in its round, the round''s own status flips to ''completed'' as a side effect.

      '
    tests:
      - id: mark-paid-01
        type: contract
        description: marking a pending record succeeds
        given:
          settlement_record_id: r1
          current_status: pending
        expect:
          status: paid
      - id: mark-paid-02
        type: contract
        description: 'PROPOSED: marking an already-paid record is idempotent, not an error (same convention as accept_invite)'
        given:
          settlement_record_id: r1
          current_status: paid
        expect:
          status: paid
          error: null
      - id: mark-paid-03
        type: contract
        description: unknown record id is rejected
        given:
          settlement_record_id: r_nonexistent
        expect_raises: SettlementRecordNotFound
      - id: mark-paid-04
        type: contract
        description: marking the LAST pending record in a round completes the round
        given:
          settlement_record_id: r_last_pending_in_round
          current_status: pending
        expect:
          status: paid
          round_status: completed
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "Idempotency default (mark-paid-02) deliberately mirrors accept_invite's — consistent convention across the graph, not a one-off choice."
    dependencies:
      - node: get_record
      - node: save_record
