project: kharcha-tracker-backend
backbone: kharcha_api
default_boundary: module
nodes:
  - id: kharcha_api
    title: "Backend API — Phase 1 MVP backbone"
    status: stub
    parent: null
    dependencies:
      - node: auth_service
      - node: group_service
      - node: expense_service
      - node: balance_aggregator
      - node: settlement_engine
      - node: payment_service
      - node: notification_service
      - node: storage_service
    interface:
      protocol: rest
    tests: []
    notes: "Phase 1 MVP scope only, per PRD §9.\n\nSee PRD §4.3 for the real endpoint list. No e2e test written yet — see original notes."
  - id: auth_service
    title: User authentication & profile
    status: stub
    parent: kharcha_api
    dependencies:
      - node: signup
      - node: login
      - node: request_password_reset
      - node: confirm_password_reset
      - node: get_current_user
      - node: storage_service
    interface:
      protocol: python-module
    tests: []
    notes: "Password/JWT/duplicate-email gaps RESOLVED (proposed) — see individual leaves.\n\nSplit into 5 leaves below. Social login/2FA deferred (PRD §9 Phase 1, FR-05 Optional)."
  - id: signup
    title: Create a new user account
    status: contract_defined
    parent: auth_service
    interface:
      protocol: python-function
      signature: 'signup(email: str, password: str, name: str) -> UserRecord'
      types:
        UserRecord: '{ id: str, email: str, name: str, avatar_url: str | None }'
    stub_behavior: Validates email uniqueness and password strength, creates the user, does NOT auto-login (caller calls login separately).
    tests:
      - id: signup-01
        type: contract
        description: valid signup creates the user
        given:
          email: a@example.com
          password: correcthorse1
          name: Alice
        expect:
          created: true
      - id: signup-02
        type: contract
        description: duplicate email is rejected
        given:
          email: a@example.com
          password: correcthorse1
          name: Alice2
          email_already_registered: true
        expect_raises: EmailAlreadyRegistered
      - id: signup-03
        type: contract
        description: 'PROPOSED password rule: below minimum strength is rejected'
        given:
          email: b@example.com
          password: abc
          name: Bob
        expect_raises: WeakPassword
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "PROPOSED (resolves the prior \"password rules\" gap): minimum 8 characters, at least one letter and one number. Simple, common baseline — override freely if a stricter/different policy is wanted.\n"
    dependencies:
      - node: save_record
  - id: login
    title: Authenticate with email + password
    status: contract_defined
    parent: auth_service
    interface:
      protocol: python-function
      signature: 'login(email: str, password: str) -> AuthResult'
      types:
        AuthResult: '{ ok: bool, token: str | None, reason: str | None }'
    stub_behavior: Verifies credentials, returns a JWT on success.
    tests:
      - id: login-01
        type: contract
        description: correct credentials succeed
        given:
          email: a@example.com
          password: correcthorse1
        expect:
          ok: true
          token_present: true
      - id: login-02
        type: contract
        description: wrong password fails
        given:
          email: a@example.com
          password: wrongpass1
        expect:
          ok: false
          reason: invalid_credentials
      - id: login-03
        type: contract
        description: "PROPOSED: unknown email gives the SAME reason as wrong password — never reveal which part was wrong"
        given:
          email: nobody@example.com
          password: whatever1
        expect:
          ok: false
          reason: invalid_credentials
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "PROPOSED (resolves the prior \"JWT expiry\" gap): 24-hour access token expiry, no refresh-token mechanism in Phase 1 — user just logs in again after expiry. Refresh tokens are a reasonable Phase 2+ addition, not MVP-critical. login-03's don't-leak-which-part-was-wrong behavior is a deliberate security choice, not an oversight — worth keeping even if other defaults here get overridden.\n"
    dependencies:
      - node: list_records
  - id: request_password_reset
    title: Request a password reset
    status: contract_defined
    parent: auth_service
    interface:
      protocol: python-function
      signature: 'request_password_reset(email: str) -> None'
    stub_behavior: If the email is registered, generates a reset token and sends it. Always returns successfully either way.
    tests:
      - id: reset-req-01
        type: contract
        description: known email succeeds (no error), reset token generated as a side effect
        given:
          email: a@example.com
        expect:
          raised: false
      - id: reset-req-02
        type: contract
        description: "PROPOSED: unknown email ALSO succeeds with no error — prevents using this endpoint to enumerate registered emails"
        given:
          email: nobody@example.com
        expect:
          raised: false
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "PROPOSED anti-enumeration default (reset-req-02) — same spirit as login-03. Resolves part of the \"duplicate-email/account enumeration\" surface the original gap note was pointing at.\n"
    dependencies:
      - node: list_records
  - id: confirm_password_reset
    title: Complete a password reset with a reset token
    status: contract_defined
    parent: auth_service
    dependencies:
      - node: signup
      - node: list_records
      - node: save_record
    interface:
      protocol: python-function
      signature: 'confirm_password_reset(reset_token: str, new_password: str) -> None'
    stub_behavior: Validates the reset token, applies the new password strength rule, updates the password.
    tests:
      - id: reset-confirm-01
        type: contract
        description: valid token + valid new password succeeds
        given:
          reset_token: validtoken123
          new_password: newpassword1
        expect:
          raised: false
      - id: reset-confirm-02
        type: contract
        description: invalid or expired token is rejected
        given:
          reset_token: expiredorbad
          new_password: newpassword1
        expect_raises: InvalidOrExpiredResetToken
      - id: reset-confirm-03
        type: contract
        description: weak new password is rejected, same rule as signup
        given:
          reset_token: validtoken123
          new_password: abc
        expect_raises: WeakPassword
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - signup.interface
    notes: "PROPOSED reset-token expiry window isn't pinned to a specific duration here (e.g. 1 hour is a common default) — flag if a specific number matters; not load-bearing for the contract shape.\n\n\nReuses signup's password-strength rule (dependency listed so both leaves' contracts stay in sync if that rule changes)."
  - id: get_current_user
    title: Resolve the current user from a token
    status: contract_defined
    parent: auth_service
    interface:
      protocol: python-function
      signature: 'get_current_user(token: str) -> UserRecord | None'
    stub_behavior: Validates and decodes the JWT, returns the associated user or None if invalid/expired.
    tests:
      - id: cur-01
        type: contract
        description: valid, non-expired token returns the user
        given:
          token: validtoken
        expect:
          found: true
      - id: cur-02
        type: contract
        description: "PROPOSED: invalid/expired token returns None, not an exception — this is meant to be called as a lightweight check from every other service's write operations, so a boolean-ish None is easier to compose with than a try/except at every call site"
        given:
          token: expiredorbad
        expect:
          found: false
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "THIS is the leaf that resolves the retrofit noted in the v3 README (\"every write operation currently takes a bare user_id string with no real authentication behind it\"). See create_group and add_expense below — both now depend on this.\n"
    dependencies:
      - node: get_record
      - node: user_record
  - id: user_record
    title: "User (service DTO)"
    status: contract_defined
    parent: auth_service
    interface:
      protocol: data-model
      model_kind: dto
      model_fields:
        id: str
        email: str
        name: str
        avatar_url: "str | None"
    notes: "Promoted out of per-function interface.types because the same shape was being re-typed by hand in three places with no guarantee they'd stay in sync.\n\nReturned by signup/login/get_current_user. Single source of truth for this shape — those three previously re-declared it inline via interface.types on each function; this node lets them reference it instead."
  - id: group_service
    title: Group creation & membership
    status: stub
    parent: kharcha_api
    dependencies:
      - node: create_group
      - node: accept_invite
      - node: get_group
      - node: is_member
      - node: storage_service
    interface:
      protocol: python-module
    tests: []
    notes: "Invite-code gap RESOLVED (proposed) — see create_group/accept_invite.\n\nSplit into 4 leaves below. Leave/delete/history/notes still deferred (Phase 2+)."
  - id: create_group
    title: Create a group
    status: contract_defined
    parent: group_service
    dependencies:
      - node: get_current_user
      - node: save_record
    interface:
      protocol: python-function
      signature: 'create_group(token: str, name: str, currency: str) -> GroupRecord'
      types:
        GroupRecord: '{ id: str, name: str, created_by_user_id: str, invite_code: str, members: list[str], currency: str, last_updated: str }'
    stub_behavior: Resolves the caller via get_current_user(token); creates the record, generates a unique invite_code, members=[resolved_user_id].
    tests:
      - id: create-01
        type: contract
        description: creator (resolved from token) is the sole initial member
        given:
          token: validtoken_for_A
          name: Trip to Miami
          currency: USD
        expect:
          members:
            - A
          invite_code_present: true
      - id: create-02
        type: contract
        description: invite_code is non-empty and matches the proposed format
        given:
          token: validtoken_for_B
          name: Roommates
          currency: USD
        expect:
          invite_code_matches: ^[A-Z0-9]{8}$
      - id: create-03
        type: contract
        description: invalid/expired token is rejected before a group is ever created
        given:
          token: expiredorbad
          name: Trip to Miami
          currency: USD
        expect_raises: NotAuthenticated
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - get_current_user.interface
    notes: "RETROFITTED this pass — previously took a bare `created_by_user_id: str` with no real authentication behind it (flagged in the v3 README as a known gap once auth_service existed). Now resolves identity from a real token via get_current_user, with create-03 covering the rejection case. PROPOSED invite_code format unchanged from before: 8-character alphanumeric, globally unique, no expiry in Phase 1.\n\n\ncreated_by_user_id is derived from token via get_current_user, not passed directly by the caller."
  - id: accept_invite
    title: Join a group via invite code
    status: contract_defined
    parent: group_service
    dependencies:
      - node: get_group
      - node: list_records
      - node: save_record
    interface:
      protocol: python-function
      signature: 'accept_invite(invite_code: str, user_id: str) -> GroupRecord'
    stub_behavior: Looks up the group by invite_code, adds user_id to members if not already present.
    tests:
      - id: accept-01
        type: contract
        description: valid code adds the user as a member
        given:
          invite_code: ABC12345
          user_id: C
        expect:
          member_added: true
      - id: accept-02
        type: contract
        description: invalid/unknown code is rejected
        given:
          invite_code: NOTREAL1
          user_id: C
        expect_raises: InvalidInviteCode
      - id: accept-03
        type: contract
        description: 'PROPOSED: re-accepting an existing membership is idempotent, not an error'
        given:
          invite_code: ABC12345
          user_id: A
          already_member: true
        expect:
          member_added: false
          error: null
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "PROPOSED idempotency rule (accept-03) — PRD doesn't say whether re-joining an already-joined group should error or no-op. Chose no-op as the friendlier default; override if a stricter behavior is wanted.\n"
  - id: get_group
    title: Fetch a group by id
    status: contract_defined
    parent: group_service
    interface:
      protocol: python-function
      signature: 'get_group(group_id: str) -> GroupRecord | None'
    stub_behavior: Returns the record, or None if not found.
    tests:
      - id: get-01
        type: contract
        description: existing group is returned
        given:
          group_id: g1
        expect:
          found: true
      - id: get-02
        type: contract
        description: unknown group returns None, not an error
        given:
          group_id: g_nonexistent
        expect:
          found: false
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "No open gaps — straightforward lookup."
    dependencies:
      - node: get_record
  - id: is_member
    title: Check group membership
    status: contract_defined
    parent: group_service
    dependencies:
      - node: get_group
    interface:
      protocol: python-function
      signature: 'is_member(group_id: str, user_id: str) -> bool'
    stub_behavior: True if user_id is in the group's members list.
    tests:
      - id: mem-01
        type: contract
        description: actual member returns true
        given:
          group_id: g1
          user_id: A
        expect:
          is_member: true
      - id: mem-02
        type: contract
        description: non-member returns false
        given:
          group_id: g1
          user_id: Z
        expect:
          is_member: false
      - id: mem-03
        type: contract
        description: "PROPOSED: nonexistent group returns false rather than raising — 'not a member' covers this case without a separate not-found error"
        given:
          group_id: g_nonexistent
          user_id: A
        expect:
          is_member: false
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: 'PROPOSED (mem-03): folds "group doesn''t exist" into "not a member" rather than a distinct error, since every current caller (add_expense) only cares about the boolean, not why. Revisit if a future caller needs to distinguish the two cases.

      '
  - id: expense_service
    title: Expense entry (equal split only, Phase 1)
    status: stub
    parent: kharcha_api
    dependencies:
      - node: add_expense
      - node: edit_expense
      - node: delete_expense
      - node: list_group_expenses
      - node: expense_split_calculator
      - node: storage_service
    interface:
      protocol: python-module
    tests: []
    notes: "Remainder-handling gap RESOLVED (proposed) — see expense_split_calculator.\n\nSplit into 4 leaves + expense_split_calculator below."
  - id: expense_split_calculator
    title: Per-expense equal-split calculator
    status: contract_defined
    parent: expense_service
    interface:
      protocol: python-function
      signature: 'calculate_equal_split(amount: Decimal, participant_ids: list[str]) -> dict[str, Decimal]'
    stub_behavior: Naive amount/n division, ignoring remainder (placeholder only).
    tests:
      - id: split-01
        type: contract
        description: 'evenly divisible: $100 across 2 participants'
        given:
          amount: 100.0
          participant_ids:
            - A
            - B
        expect:
          shares:
            A: 50.0
            B: 50.0
      - id: split-02
        type: contract
        description: 'NOT evenly divisible: $100 across 3 -> $33.33 each with $0.01 left over. PROPOSED rule: remainder cents go to participants in list order, starting first, until exhausted. Here that''s participant A getting the extra cent.

          '
        given:
          amount: 100.0
          participant_ids:
            - A
            - B
            - C
        expect:
          shares:
            A: 33.34
            B: 33.33
            C: 33.33
      - id: split-03
        type: contract
        description: 'sanity check: shares always sum exactly to the input amount (property, not just this example)'
        given:
          amount: 10.0
          participant_ids:
            - A
            - B
            - C
            - D
            - E
            - F
            - G
        expect:
          sum_of_shares: 10.0
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "PROPOSED remainder rule (see file header) — override freely, this is a default chosen to unblock decomposition, not a confirmed product decision.\n\n\nReturns each participant's share; values sum EXACTLY to `amount` (no lost cents)."
  - id: add_expense
    title: Create an expense
    status: contract_defined
    parent: expense_service
    dependencies:
      - node: expense_split_calculator
      - node: is_member
      - node: get_current_user
      - node: save_record
    interface:
      protocol: python-function
      signature: 'add_expense(token: str, group_id: str, participant_ids: list[str], amount: Decimal, description: str, date: str) -> ExpenseRecord'
      types:
        ExpenseRecord: '{ id: str, group_id: str, payer_id: str, amount: Decimal, shares: dict[str, Decimal], description: str, date: str, status: ''pending'' }'
    stub_behavior: Resolves caller via get_current_user(token); validates payer + all participants via is_member(group_id, ...); creates and returns a record with status='pending', shares from expense_split_calculator.
    tests:
      - id: add-01
        type: contract
        description: valid expense is created with correctly computed shares
        given:
          token: validtoken_for_A
          group_id: g1
          participant_ids:
            - A
            - B
            - C
          amount: 100.0
          description: Dinner
          date: '2026-08-11'
        expect:
          status: pending
          payer_id: A
          shares:
            A: 33.34
            B: 33.33
            C: 33.33
      - id: add-02
        type: contract
        description: a participant who isn't a group member is rejected
        given:
          token: validtoken_for_A
          group_id: g1
          participant_ids:
            - A
            - Z
          amount: 50.0
          description: Snacks
          date: '2026-08-11'
        expect_raises: NotAGroupMember
      - id: add-03
        type: contract
        description: invalid/expired token is rejected before an expense is ever created
        given:
          token: expiredorbad
          group_id: g1
          participant_ids:
            - A
            - B
          amount: 20.0
          description: Coffee
          date: '2026-08-11'
        expect_raises: NotAuthenticated
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - is_member.interface
        - get_current_user.interface
    notes: "RETROFITTED this pass — previously took a bare `payer_id: str` with no authentication behind it (flagged as a gap once auth_service existed, resolved the same way as create_group). The earlier group-membership gap is still resolved too (add-02 unchanged in substance, just now reads `payer_id` from the resolved token instead of taking it as raw input).\n\n\npayer_id is resolved from token via get_current_user, not passed directly — the authenticated caller is always the payer."
  - id: edit_expense
    title: Edit an expense (only if unlocked)
    status: contract_defined
    parent: expense_service
    dependencies:
      - node: expense_split_calculator
      - node: is_expense_locked
      - node: get_record
      - node: save_record
    interface:
      protocol: python-function
      signature: 'edit_expense(expense_id: str, updates: dict) -> ExpenseRecord'
    stub_behavior: Rejects if is_expense_locked(expense_id); otherwise applies updates and recomputes shares if amount/participants changed.
    tests:
      - id: edit-01
        type: contract
        description: editing an unlocked expense recomputes shares
        given:
          expense_id: e1
          locked: false
          updates:
            amount: 90.0
        expect:
          recomputed: true
      - id: edit-02
        type: contract
        description: editing a locked (settlement-round-covered) expense is rejected
        given:
          expense_id: e2
          locked: true
          updates:
            amount: 90.0
        expect_raises: ExpenseLocked
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - is_expense_locked.interface
    notes: "RESOLVED this pass — previously depended on a vague, undefined \"settled\" status. Now depends on payment_service's is_expense_locked directly, which has a real, coherent definition (locked once covered by any generated settlement round — see its notes). Error renamed ExpenseAlreadySettled -> ExpenseLocked to match the actual concept.\n"
  - id: delete_expense
    title: Delete an expense (only if unlocked)
    status: contract_defined
    parent: expense_service
    dependencies:
      - node: is_expense_locked
      - node: delete_record
    interface:
      protocol: python-function
      signature: 'delete_expense(expense_id: str) -> None'
    stub_behavior: Rejects if is_expense_locked(expense_id); otherwise deletes.
    tests:
      - id: del-01
        type: contract
        description: deleting an unlocked expense succeeds
        given:
          expense_id: e1
          locked: false
        expect:
          deleted: true
      - id: del-02
        type: contract
        description: deleting a locked expense is rejected
        given:
          expense_id: e2
          locked: true
        expect_raises: ExpenseLocked
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - is_expense_locked.interface
    notes: "Same retrofit as edit_expense — see its notes for the full reasoning."
  - id: list_group_expenses
    title: List all expenses for a group
    status: contract_defined
    parent: expense_service
    interface:
      protocol: python-function
      signature: 'list_expenses(group_id: str) -> list[ExpenseRecord]'
    stub_behavior: Returns all ExpenseRecords for the group, newest first.
    tests:
      - id: list-01
        type: contract
        description: empty group returns empty list
        given:
          group_id: g_empty
        expect:
          expenses: []
      - id: list-02
        type: contract
        description: group with expenses returns them all
        given:
          group_id: g1
          fixture_expense_count: 3
        expect:
          expense_count: 3
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
    notes: "Straightforward query — no open gaps."
    dependencies:
      - node: list_records
  - id: balance_aggregator
    title: Aggregate a group's expenses into net balances per user
    status: contract_defined
    parent: kharcha_api
    dependencies:
      - node: list_group_expenses
    interface:
      protocol: python-function
      signature: 'compute_net_balances(group_id: str) -> dict[str, Decimal]'
    stub_behavior: Sums each user's (amount_paid_as_payer - sum_of_their_shares_across_all_expenses) in the group.
    tests:
      - id: bal-01
        type: contract
        description: 'One $100 expense, paid by A, split equally among A/B/C/D (same numbers as settlement_engine''s settle-02 test, so the two nodes'' contracts visibly chain together).

          '
        given:
          group_id: g1
          fixture_expenses:
            - payer_id: A
              amount: 100.0
              shares:
                A: 25.0
                B: 25.0
                C: 25.0
                D: 25.0
        expect:
          balances:
            A: 75.0
            B: -25.0
            C: -25.0
            D: -25.0
      - id: bal-02
        type: contract
        description: group with no expenses -> everyone at zero
        given:
          group_id: g_empty
          fixture_expenses: []
        expect:
          balances: {}
    context:
      include:
        - self.interface
        - self.tests
        - self.stub_behavior
        - list_group_expenses.interface
    notes: "NEW node this pass — didn't exist in v1. Filling a real gap between per-expense splits and group-wide settlement, not present anywhere in the original PRD's architecture table (§6) or FR list. Only settled/paid expenses vs. all expenses being included in the aggregation is itself another open question tied to the same settlement-persistence gap noted on payment_service.\n\n\npositive = owed money (paid more than their share), negative = owes money — same sign convention as settlement_engine's input, deliberately, so it feeds straight in."
  - id: settlement_engine
    title: Settle-up calculation
    status: contract_defined
    parent: kharcha_api
    interface:
      protocol: python-function
      signature: 'compute_settlements(balances: dict[str, Decimal]) -> list[SettlementInstruction]'
      types:
        SettlementInstruction: '{ from_user: str, to_user: str, amount: Decimal }'
    stub_behavior: "Returns [] for any input (placeholder — real contract below)."
    tests:
      - id: settle-01
        type: contract
        description: "two-user case, PRD §4.2 example 1"
        given:
          balances:
            A: 100
            B: -100
        expect:
          settlements:
            - from_user: B
              to_user: A
              amount: 100
      - id: settle-02
        type: contract
        description: "four-user case, PRD §4.2 example 2 — same numbers balance_aggregator's bal-01 test produces"
        given:
          balances:
            A: 75
            B: -25
            C: -25
            D: -25
        expect:
          settlements:
            - from_user: B
              to_user: A
              amount: 25
            - from_user: C
              to_user: A
              amount: 25
