        - self.tests
        - self.stub_behavior
    notes: "PROPOSED Phase-1 scope resolution (see file header): greedy highest-creditor/highest-debtor matching, which reproduces both PRD examples exactly. Global-minimum-transaction guarantees for arbitrary N stay Phase 2 (\"Smart Debts Optimization\" per §9). Input/output is a PURE function — no persistence. See payment_service for why that's now a flagged gap, not just a design note.\n\n\nbalances: positive = owed, negative = owes, per PRD §4.2."
  - id: payment_service
    title: "Manual settlement marking (Phase 1) — no real payment gateway"
    status: stub
    parent: kharcha_api
    dependencies:
