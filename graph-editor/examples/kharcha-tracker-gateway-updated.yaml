- id: flat_file
  title: ''
  status: stub
  boundary: null
  parent: storage_service
  interface:
    protocol: class
    fields: []
  contract_version: 0.0.0
  dependencies:
  - node: storage_interface
  - node: group_record
  - node: user_record
  - node: expense_record
  - node: audit_log
  stub_behavior: ''
  tests: []
  notes: "Database folder Path: kharcha-tracker/storage_service/flat_file_db/'. Create if this file does\
    \ not exist yet. \n\nSchema table files to read/write to:\nuser_record - kharcha-tracker/storage_service/flat_file_db/user_records.json\n\
    group_record - kharcha-tracker/storage_service/flat_file_db/group_records.json\nexpense_record - kharcha-tracker/storage_service/flat_file_db/expense_records.json\n\
    audit_log - kharcha-tracker/storage_service/flat_file_db/audit_logs.json\n\nWorking: All data must\
    \ be loaded as list<schema_record> in-memory for quick read/write. Every write should update in-memory\
    \ list and immediately trigger file write to relevant schema table.\n\nThings to Consider:\n1. ID\
    \ generation: UUIDs. Record ID Format: UUID string in get_record\n2. Schema Validation: Validate that\
    \ schema parameter exists in registry before operations\n3. ExpenseRecord Handling: Deep-copy nested\
    \ objects during deserialisation; use json.dump() with default=str to handle serialisation. This is\
    \ regarding DTOs ‘List<expense_payments>’ and ‘List<expense_share’ which will be JSON encoded strings\
    \ stored for schema ‘ExpenseRecord.paid_by’ and ‘ExpenseRecord.expn_splt’ \n4. Transaction ID Generation:\
    \ Auto-incrementing Unsigned Int 32-bit (using MAX_TRANSACTION_ID from constants = 4294967295)\n5.\
    \ Error Handling: Return success/failure with message format for all operations\n6. In-Memory Storage\
    \ Strategy: Multi-tier approach\n\t- Master tables (user, group): Fully loaded & cached\n\t- Transaction\
    \ tables (expense, audit_log): Lazy-loaded based on group_id; limit max transactions per group\n\t\
    - Pagination: Load in pages of 1000 records from file\n7. Storage structure: Should records be stored\
    \ as:\n\t- Flat JSON array: {“{id}: [{…}]}, where id is the record_id i.e. UUID\n8. Soft delete implementation:\
    \ Set is_deleted: true \n9. Audit log structure: Following structure is approved\n{\n    \"id\": ...,\n\
    \    \"action\": \"CREATE|UPDATE|DELETE\",\n    \"table/schema: \"...\",\n    \"user_id\": ...,\n\
    \    \"created_at\": \"...\",\n    \"old_value\": {...},\n    \"new_value\": {...}\n}\n10. Referential\
    \ integrity: Must implement CASCADE delete for child records when parent is deleted\n11. Search/filters:\
    \ list_records() must support filters (by user_id, by group_id, by field values)\n12. Import strategy:\
    \ Relative imports (from .schema.*)\n13. Deduplication rule: When same record.id exists in in-memory\
    \ list, keep the newest (last) record\n14. Schema registry: Want a schema_registry.json for mapping\
    \ schema names to default classes\n15. Constants: The schema files reference .constants - refer ‘./kharcha-tracker/constants/*.*’\
    \ for all ENUMs\n16. Audit on GET: When calling get_record, Do Not create an audit log entry. Audit\
    \ log entry must for delete-update-write operations only\n"
  prompt_template: ''
  prompt: ''
  maps_to: []
