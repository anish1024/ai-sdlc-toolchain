- id: expense_category
  title: expense category enum
  status: unsplit
  boundary: null
  parent: constants
  interface:
    protocol: data-model
    model_kind: enum
    enum_type: string
    enum_values:
    - name: GROCERY
      value: GROCERY
      notes: Fruits, vegetables, toiletries, kitchen items, home decor.
    - name: UTILITY
      value: UTILITY
      notes: Electricity bills, phone bill, fuel, water, and any metered connections.
    - name: TRAVEL
      value: TRAVEL
      notes: Cab, rail ticket, bus, air ticket.
    - name: ENTERTAINMENT
      value: ENTERTAINMENT
      notes: Movies, subscriptions, fun activities.
    - name: FOOD_N_DINING
      value: FOOD_N_DINING
      notes: Eating out, take-away.
    - name: OP_EXP
      value: OP_EXP
      notes: 'Operating expenses: society maintenance, allowances, maid salary, pest control, replacing
        light bulbs, servicing HVAC/AC units, minor electrical work. Balcony gardening and minor home
        decor (bedsheets, cushions, curtains) belong here since it maintains what already exists.'
    - name: CAP_EXP
      value: CAP_EXP
      notes: 'Long-term tangible items with useful life > 1 year: furniture & fixtures (desks, chairs,
        sofas, beds, permanent lighting), structural remodeling (false ceilings, built-in cabinetry, permanent
        flooring, safety doors). Minor decor/design fees that do not add permanent structural value belong
        to OP_EXP instead (cushions, rugs, paintings, temporary curtains, standalone cosmetic consultation
        fees) — this boundary is the actual spec, apply it exactly when categorizing.'
    - name: ACCOMMODATION
      value: ACCOMMODATION
      notes: Rent, hotel, Airbnb, etc.
    - name: SETTLEMENT
      value: SETTLEMENT
      notes: Used to record user-to-user settlement payments, not a real purchase category.
    - name: CUSTOM
      value: CUSTOM
      notes: Placeholder for user-defined expense categories.
  contract_version: 0.0.0
  dependencies: []
  stub_behavior: ''
  tests: []
  notes: "Category applied to an expense for reporting/budgeting. See per-value notes for the exact OP_EXP\
    \ vs CAP_EXP boundary, which is the one genuinely ambiguous distinction in this set.\n\nENUM = [\"\
    GROCERY\", \"UTILITY\", \"TRAVEL\", \"ENTERTAINMENT\", \"FOOD_N_DINING\", \"OP_EXP\", \"CAP_EXP\"\
    , \"ACCOMMODATION\", \"SETTLEMENT\", \"CUSTOM\"]\n\n# Standard Expenses\n\n    GROCERY = \"Fruits,\
    \ vegetables, toiletries, kitchen items, home decor, \"\n\n    UTILITY = \"electricity bills, phone\
    \ bill, fuel, water and ay metered connections\"\n\n    TRAVEL = \"cab, rail tkt, bus, air tkt\"\n\
    \n    ENTERTAINMENT = \"Movie, any subscriptions, fun activites\"\n\n    FOOD_N_DINING = \"Eating\
    \ out, take-away\"\n\n    OP_EXP = \"Operating expenses like society Maintenance, allowances, maid\
    \ salary, pest-control, replacing light bulbs, servicing HVAC/air conditioning units, and minor electrical\
    \ work. Balcony gardening and Home decor like replacing bedsheets, cushions, curtains can be included\
    \ here since it maintaining what is already present\"\n    \n    CAP_EXP = \"Long-term tangible items\
    \ with a useful life of more than one year like Furniture & Fixtures like Desks, office chairs, sofas,\
    \ dining tables, beds, and permanent lighting fixtures. Interior designing and structural changes\
    \ made to a property you own or lease like False ceilings, built-in cabinetry, permanent flooring,\
    \ safety doors and structural re-modeling. Minor home decor and design fees that do not add permanent\
    \ structural value belong to OP_EXP like Cushions, rugs, paintings, temporary curtains, and standalone\
    \ consultation fees for minor cosmetic refreshes\"\n\n    ACCOMMODATION = \"Rent, hotel, air-bnb,\
    \ etc.\"\n    \n# Special Categories\n    SETTLEMENT = \"Settlement\"  # Used to record user-to-user\
    \ payments\n    CUSTOM = \"Custom\"         # Placeholder for user-defined expenses"
  maps_to: []
