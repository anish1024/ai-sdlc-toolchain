    interface:
      protocol: data-model
      model_kind: dto
      model_fields: []
      note: |-
        # Currency / Decimal Precision (Standard Finance: 2 decimal places)
        DECIMAL_PRECISION = 2

        # Floating Point Epsilon for Zero Sum Validation (Accounting Tolerance)
        # Used when checking if Net Debt Matrix Sum == 0
        FLOAT_EPSILON = 0.01

        # Transaction Limits (if applicable to your DB type)
        MAX_TRANSACTION_ID = 4294967295  # uint32 range
        MAX_GROUP_SIZE = 100           # Soft limit on group size
        MAX_PAYOUTS_PER_BATCH = 100     # Processing batch size
