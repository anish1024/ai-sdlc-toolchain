  - id: expense_category
    title: expense category enum
    status: unsplit
    boundary: null
    parent: constants
    interface:
      protocol: data-model
      model_kind: dto
      model_fields: []
      note: >-
        ENUM = ["GROCERY", "UTILITY", "TRAVEL", "ENTERTAINMENT",
        "FOOD_N_DINING", "OP_EXP", "CAP_EXP", "ACCOMMODATION", "SETTLEMENT",
        "CUSTOM"]


        # Standard Expenses

            GROCERY = "Fruits, vegetables, toiletries, kitchen items, home decor, "

            UTILITY = "electricity bills, phone bill, fuel, water and ay metered connections"

            TRAVEL = "cab, rail tkt, bus, air tkt"

            ENTERTAINMENT = "Movie, any subscriptions, fun activites"

            FOOD_N_DINING = "Eating out, take-away"

            OP_EXP = "Operating expenses like society Maintenance, allowances, maid salary, pest-control, replacing light bulbs, servicing HVAC/air conditioning units, and minor electrical work. Balcony gardening and Home decor like replacing bedsheets, cushions, curtains can be included here since it maintaining what is already present"
            
            CAP_EXP = "Long-term tangible items with a useful life of more than one year like Furniture & Fixtures like Desks, office chairs, sofas, dining tables, beds, and permanent lighting fixtures. Interior designing and structural changes made to a property you own or lease like False ceilings, built-in cabinetry, permanent flooring, safety doors and structural re-modeling. Minor home decor and design fees that do not add permanent structural value belong to OP_EXP like Cushions, rugs, paintings, temporary curtains, and standalone consultation fees for minor cosmetic refreshes"

            ACCOMMODATION = "Rent, hotel, air-bnb, etc."
            
        # Special Categories
            SETTLEMENT = "Settlement"  # Used to record user-to-user payments
            CUSTOM = "Custom"         # Placeholder for user-defined expenses
    contract_version: 0.0.0
    dependencies: []
    stub_behavior: ''
    tests: []
    notes: Create this data-model as ENUM
    maps_to: []
